name: Multiplayer validation

on:
  push:
    branches:
      - ci/multiplayer-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Clean analyzer lints found by validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('lib/domain/mdtbbs/mdtbbs_multiplayer_service.dart')
          service = service_path.read_text()
          service = service.replace("import 'package:flutter/foundation.dart';\n", '')
          guard = """      if (!_isAccountEpochCurrent(epoch) || _current.session?.id != session.id)\n        return;"""
          wrapped_guard = """      if (!_isAccountEpochCurrent(epoch) || _current.session?.id != session.id) {\n        return;\n      }"""
          count = service.count(guard)
          if count != 4:
              raise SystemExit(f'expected 4 single-line session guards, found {count}')
          service = service.replace(guard, wrapped_guard)
          service_path.write_text(service)

          tunnel_path = Path('lib/domain/mdtbbs/mdtbbs_relay_tunnel.dart')
          tunnel = tunnel_path.read_text()
          completer_guard = """        if (completer != null && !completer.isCompleted)\n          completer.complete(signal);"""
          wrapped_completer_guard = """        if (completer != null && !completer.isCompleted) {\n          completer.complete(signal);\n        }"""
          count = tunnel.count(completer_guard)
          if count != 1:
              raise SystemExit(f'expected 1 auth completer guard, found {count}')
          tunnel = tunnel.replace(completer_guard, wrapped_completer_guard)
          tunnel_path.write_text(tunnel)
          PY

      - name: Format changed multiplayer sources
        shell: bash
        run: |
          dart format \
            lib/data/net/mdtbbs/mdtbbs_relay_frames.dart \
            lib/domain/mdtbbs/mdtbbs_multiplayer_service.dart \
            lib/domain/mdtbbs/mdtbbs_relay_proxy.dart \
            lib/domain/mdtbbs/mdtbbs_relay_tunnel.dart
          if ! git diff --quiet -- \
            lib/data/net/mdtbbs/mdtbbs_relay_frames.dart \
            lib/domain/mdtbbs/mdtbbs_multiplayer_service.dart \
            lib/domain/mdtbbs/mdtbbs_relay_proxy.dart \
            lib/domain/mdtbbs/mdtbbs_relay_tunnel.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              lib/data/net/mdtbbs/mdtbbs_relay_frames.dart \
              lib/domain/mdtbbs/mdtbbs_multiplayer_service.dart \
              lib/domain/mdtbbs/mdtbbs_relay_proxy.dart \
              lib/domain/mdtbbs/mdtbbs_relay_tunnel.dart
            git commit -m "style: clean multiplayer analyzer lints"
            git push origin HEAD:ci/multiplayer-validation
          fi

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/data/net/mdtbbs/mdtbbs_relay_frames.dart \
            lib/domain/mdtbbs/mdtbbs_multiplayer_service.dart \
            lib/domain/mdtbbs/mdtbbs_relay_proxy.dart \
            lib/domain/mdtbbs/mdtbbs_relay_tunnel.dart

      - name: Analyze changed multiplayer sources
        run: |
          flutter analyze \
            lib/data/net/mdtbbs/mdtbbs_relay_frames.dart \
            lib/domain/mdtbbs/mdtbbs_multiplayer_service.dart \
            lib/domain/mdtbbs/mdtbbs_relay_proxy.dart \
            lib/domain/mdtbbs/mdtbbs_relay_tunnel.dart

      - name: Run existing repository tests
        run: flutter test

      - name: Run ephemeral relay frame regression tests
        shell: bash
        run: |
          cat > test/__ci_multiplayer_relay_frames_test.dart <<'DART'
          import 'dart:typed_data';

          import 'package:copper_launcher/data/net/mdtbbs/mdtbbs_relay_frames.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('UDP MLR1 frame has exact length and round-trips', () {
              const peerId = 'peer_123';
              final payload = <int>[1, 2, 3, 4, 255];
              final encoded = MdtbbsRelayFrame.udpDatagram(peerId, payload);

              expect(encoded, isNotNull);
              expect(encoded!.length, 7 + peerId.length + payload.length);

              final parsed = MdtbbsRelayFrame.parse(encoded);
              expect(parsed, isNotNull);
              expect(parsed!.type, MdtbbsRelayFrame.typeUdpDatagram);
              expect(parsed.targetPeerId, peerId);
              expect(parsed.payload, orderedEquals(payload));
            });

            test('TCP payload boundary accepts 16 KiB and rejects larger direct frame', () {
              final maxPayload = Uint8List(MdtbbsRelayFrame.maxTcpPayload);
              final encoded = MdtbbsRelayFrame.tcpData(42, maxPayload);
              expect(encoded, isNotNull);

              final parsed = MdtbbsRelayFrame.parse(encoded!);
              expect(parsed, isNotNull);
              expect(parsed!.streamId, 42);
              expect(parsed.payload.length, MdtbbsRelayFrame.maxTcpPayload);

              expect(
                MdtbbsRelayFrame.tcpData(
                  42,
                  Uint8List(MdtbbsRelayFrame.maxTcpPayload + 1),
                ),
                isNull,
              );
            });

            test('malformed UDP frame without payload is rejected', () {
              final encoded = MdtbbsRelayFrame.udpDatagram('peer', <int>[9])!;
              final malformed = Uint8List.fromList(encoded.sublist(0, encoded.length - 1));
              expect(MdtbbsRelayFrame.parse(malformed), isNull);
            });
          }
          DART
          flutter test test/__ci_multiplayer_relay_frames_test.dart
          rm -f test/__ci_multiplayer_relay_frames_test.dart

      - name: Compile Linux debug application
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --debug
